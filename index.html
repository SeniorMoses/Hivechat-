<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FastAPI Chat</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111b21;
            color: #e9edef;

            min-height: 100vh;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }


        /* =================================
           AUTH SCREEN
        ================================= */

        #auth-screen {
            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background: #111b21;
        }


        .auth-card {
            width: 100%;
            max-width: 420px;

            background: #202c33;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.35);
        }


        .auth-title {
            text-align: center;

            font-size: 28px;

            margin-bottom: 8px;
        }


        .auth-subtitle {
            text-align: center;

            color: #8696a0;

            margin-bottom: 25px;
        }


        .auth-mode {
            display: flex;

            margin-bottom: 20px;

            border-bottom:
                1px solid #374045;
        }


        .auth-mode button {
            flex: 1;

            padding: 12px;

            border: none;

            background: transparent;

            color: #8696a0;

            font-size: 15px;
        }


        .auth-mode button.active {
            color: #00a884;

            border-bottom:
                2px solid #00a884;
        }


        .form-group {
            margin-bottom: 15px;
        }


        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #d1d7db;

            font-size: 14px;
        }


        .form-group input {
            width: 100%;

            padding: 13px;

            border: 1px solid #374045;

            border-radius: 7px;

            outline: none;

            background: #111b21;

            color: #e9edef;

            font-size: 15px;
        }


        .form-group input:focus {
            border-color: #00a884;
        }


        #auth-submit {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #00a884;

            color: white;

            font-size: 16px;

            margin-top: 5px;
        }


        #auth-submit:hover {
            background: #008f72;
        }


        #auth-submit:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        #auth-message {
            min-height: 20px;

            margin-top: 15px;

            text-align: center;

            font-size: 14px;
        }


        /* =================================
           CHAT SCREEN
        ================================= */

        #chat-screen {
            display: none;

            width: 100%;

            height: 100vh;
        }


        .chat-container {
            display: flex;

            width: 100%;

            height: 100%;
        }


        /* =================================
           SIDEBAR
        ================================= */

        .sidebar {
            width: 320px;

            display: flex;

            flex-direction: column;

            background: #111b21;

            border-right:
                1px solid #374045;
        }


        .sidebar-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 15px;

            background: #202c33;
        }


        .sidebar-title {
            font-size: 20px;

            font-weight: bold;
        }


        #logout-button {
            border: none;

            background: transparent;

            color: #8696a0;

            font-size: 14px;
        }


        #logout-button:hover {
            color: #e9edef;
        }


        #users-container {
            flex: 1;

            overflow-y: auto;
        }


        .user-item {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 14px 16px;

            border-bottom:
                1px solid #202c33;

            cursor: pointer;
        }


        .user-item:hover {
            background: #202c33;
        }


        .user-item.selected {
            background: #2a3942;
        }


        .user-info {
            min-width: 0;
        }


        .username {
            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

            font-size: 16px;
        }


        .status {
            margin-top: 4px;

            color: #8696a0;

            font-size: 12px;
        }


        .status.online {
            color: #00a884;
        }


        /* =================================
           CHAT AREA
        ================================= */

        .chat-area {
            flex: 1;

            display: flex;

            flex-direction: column;

            min-width: 0;

            background: #0b141a;
        }


        .chat-header {
            height: 64px;

            display: flex;

            align-items: center;

            padding: 10px 18px;

            background: #202c33;
        }


        #selected-username {
            font-size: 17px;

            font-weight: bold;
        }


        #selected-status {
            margin-top: 3px;

            color: #8696a0;

            font-size: 12px;
        }


        /* =================================
           EMPTY CHAT
        ================================= */

        #empty-chat {
            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            text-align: center;

            color: #8696a0;
        }


        #empty-chat h2 {
            color: #d1d7db;

            margin-bottom: 10px;
        }


        /* =================================
           MESSAGES
        ================================= */

        #messages-container {
            flex: 1;

            display: flex;

            flex-direction: column;

            gap: 8px;

            overflow-y: auto;

            padding: 20px;
        }


        .message {
            max-width: 70%;

            padding: 8px 10px;

            border-radius: 8px;

            word-wrap: break-word;

            line-height: 1.4;
        }


        .message.sent {
            align-self: flex-end;

            background: #005c4b;
        }


        .message.received {
            align-self: flex-start;

            background: #202c33;
        }


        .message-content {
            display: inline;
        }


        .message-meta {
            display: inline;

            margin-left: 8px;

            white-space: nowrap;
        }


        .message-time {
            color: #aebac1;

            font-size: 10px;
        }


        .message-ticks {
            margin-left: 4px;

            color: #8696a0;

            font-size: 11px;
        }


        .message-ticks.delivered {
            color: #53bdeb;
        }


        /* =================================
           MESSAGE INPUT
        ================================= */

        .message-input-area {
            display: flex;

            gap: 8px;

            padding: 10px;

            background: #202c33;
        }


        #message-input {
            flex: 1;

            min-width: 0;

            padding: 12px 15px;

            border: none;

            border-radius: 8px;

            outline: none;

            background: #2a3942;

            color: #e9edef;

            font-size: 15px;
        }


        #message-input::placeholder {
            color: #8696a0;
        }


        #send-button {
            width: 45px;

            height: 45px;

            flex-shrink: 0;

            border: none;

            border-radius: 50%;

            background: #00a884;

            color: white;

            font-size: 18px;
        }


        #send-button:hover:not(:disabled) {
            background: #008f72;
        }


        #send-button:disabled {
            opacity: 0.4;

            cursor: not-allowed;
        }


        /* =================================
           LOADING / ERROR
        ================================= */

        .loading {
            padding: 25px;

            text-align: center;

            color: #8696a0;
        }


        .error-message {
            padding: 25px;

            text-align: center;

            color: #ea0038;
        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .sidebar {
                width: 100%;
            }


            .chat-area {
                display: none;
            }


            .chat-container.chat-open
            .sidebar {
                display: none;
            }


            .chat-container.chat-open
            .chat-area {
                display: flex;
            }


            .message {
                max-width: 85%;
            }


            .auth-card {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


    <section id="auth-screen">

        <div class="auth-card">

            <h1 class="auth-title">
                FastAPI Chat
            </h1>


            <p class="auth-subtitle">
                Real-time messaging
            </p>


            <div class="auth-mode">

                <button
                    id="login-mode"
                    class="active"
                    type="button"
                >
                    Login
                </button>


                <button
                    id="signup-mode"
                    type="button"
                >
                    Sign Up
                </button>

            </div>


            <form id="auth-form">


                <div
                    class="form-group"
                    id="email-group"
                    style="display: none;"
                >

                    <label for="email">
                        Email
                    </label>


                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                    >

                </div>


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>


                    <input
                        id="username"
                        type="text"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    id="auth-submit"
                    type="submit"
                >
                    Login
                </button>

            </form>


            <div id="auth-message"></div>

        </div>

    </section>


    <section id="chat-screen">

        <div
            id="chat-container"
            class="chat-container"
        >


            <aside class="sidebar">


                <div class="sidebar-header">

                    <div class="sidebar-title">
                        Chats
                    </div>


                    <button
                        id="logout-button"
                        type="button"
                    >
                        Logout
                    </button>

                </div>


                <div id="users-container">

                    <div class="loading">
                        Loading users...
                    </div>

                </div>

            </aside>


            <main class="chat-area">


                <header class="chat-header">

                    <div>

                        <div id="selected-username">
                            Select a user
                        </div>


                        <div id="selected-status">
                            No conversation selected
                        </div>

                    </div>

                </header>


                <div id="empty-chat">

                    <div>

                        <h2>
                            Welcome to FastAPI Chat
                        </h2>


                        <p>
                            Select a user to start chatting.
                        </p>

                    </div>

                </div>


                <div
                    id="messages-container"
                    style="display: none;"
                ></div>


                <div class="message-input-area">

                    <input
                        id="message-input"
                        type="text"
                        placeholder="Type a message..."
                        autocomplete="off"
                        disabled
                    >


                    <button
                        id="send-button"
                        type="button"
                        disabled
                    >
                        ➤
                    </button>

                </div>

            </main>

        </div>

    </section>


    <script>

                const state = {
            token: localStorage.getItem("access_token"),
            mode: "login",
            currentUserId: null,
            selectedUser: null,
            users: [],
            socket: null,
            reconnectTimer: null,
            reconnectAttempts: 0
        };


        const authScreen =
            document.getElementById("auth-screen");

        const chatScreen =
            document.getElementById("chat-screen");

        const chatContainer =
            document.getElementById("chat-container");

        const authForm =
            document.getElementById("auth-form");

        const emailGroup =
            document.getElementById("email-group");

        const emailInput =
            document.getElementById("email");

        const usernameInput =
            document.getElementById("username");

        const passwordInput =
            document.getElementById("password");

        const authSubmit =
            document.getElementById("auth-submit");

        const authMessage =
            document.getElementById("auth-message");

        const loginMode =
            document.getElementById("login-mode");

        const signupMode =
            document.getElementById("signup-mode");

        const usersContainer =
            document.getElementById("users-container");

        const selectedUsername =
            document.getElementById("selected-username");

        const selectedStatus =
            document.getElementById("selected-status");

        const emptyChat =
            document.getElementById("empty-chat");

        const messagesContainer =
            document.getElementById("messages-container");

        const messageInput =
            document.getElementById("message-input");

        const sendButton =
            document.getElementById("send-button");

        const logoutButton =
            document.getElementById("logout-button");


        function showAuthMessage(
            message,
            isError = true
        ) {
            authMessage.textContent = message;

            authMessage.style.color =
                isError
                    ? "#ea0038"
                    : "#00a884";
        }


        function getErrorMessage(data) {

            if (!data) {
                return "Something went wrong";
            }


            if (typeof data.detail === "string") {
                return data.detail;
            }


            if (Array.isArray(data.detail)) {

                return data.detail
                    .map(error => {

                        if (typeof error === "string") {
                            return error;
                        }

                        return (
                            error.msg ||
                            "Validation error"
                        );

                    })
                    .join(", ");
            }


            return "Request failed";
        }


        function setAuthMode(mode) {

            state.mode = mode;

            const signup =
                mode === "signup";


            loginMode.classList.toggle(
                "active",
                !signup
            );

            signupMode.classList.toggle(
                "active",
                signup
            );


            emailGroup.style.display =
                signup
                    ? "block"
                    : "none";


            emailInput.required = signup;


            authSubmit.textContent =
                signup
                    ? "Create Account"
                    : "Login";


            passwordInput.autocomplete =
                signup
                    ? "new-password"
                    : "current-password";


            showAuthMessage("", false);
        }


        loginMode.addEventListener(
            "click",
            () => setAuthMode("login")
        );


        signupMode.addEventListener(
            "click",
            () => setAuthMode("signup")
        );


        function setAuthLoading(loading) {

            authSubmit.disabled = loading;

            authSubmit.textContent =
                loading
                    ? "Please wait..."
                    : (
                        state.mode === "signup"
                            ? "Create Account"
                            : "Login"
                    );
    }

                authForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                showAuthMessage("", false);

                setAuthLoading(true);


                const username =
                    usernameInput.value.trim();

                const password =
                    passwordInput.value;

                try {

                    let endpoint;
                    let payload;


                    if (state.mode === "signup") {

                        endpoint = "/signup";

                        payload = {
                            username: username,
                            email: emailInput.value.trim(),
                            password: password
                        };

                    } else {

                        endpoint = "/login";

                        payload = {
                            username: username,
                            password: password
                        };
                    }


                    const response =
                        await fetch(endpoint, {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(payload)
                        });


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            getErrorMessage(data)
                        );
                    }


                    state.token =
                        data.access_token;


                    localStorage.setItem(
                        "access_token",
                        state.token
                    );


                    showAuthMessage(
                        state.mode === "signup"
                            ? "Account created successfully."
                            : "Login successful.",
                        false
                    );


                    authForm.reset();


                    await startApp();

                } catch (error) {

                    console.error(
                        "Authentication error:",
                        error
                    );


                    showAuthMessage(
                        error.message ||
                        "Authentication failed."
                    );

                } finally {

                    setAuthLoading(false);
                }
            }
        );


        function decodeToken(token) {

            try {

                const parts =
                    token.split(".");


                if (parts.length !== 3) {
                    return null;
                }


                const payload =
                    parts[1]
                        .replace(/-/g, "+")
                        .replace(/_/g, "/");


                const decoded =
                    atob(payload);


                return JSON.parse(decoded);

            } catch (error) {

                console.error(
                    "Token decode error:",
                    error
                );

                return null;
            }
        }


        function getCurrentUserId() {

            if (!state.token) {
                return null;
            }


            const payload =
                decodeToken(state.token);


            if (!payload || !payload.sub) {
                return null;
            }


            return Number(payload.sub);
        }


        function showChatScreen() {

            authScreen.style.display = "none";

            chatScreen.style.display = "block";
        }


        function showAuthScreen() {

            chatScreen.style.display = "none";

            authScreen.style.display = "flex";
        }


        function clearChatState() {

            state.currentUserId = null;

            state.selectedUser = null;

            state.users = [];


            usersContainer.innerHTML = "";

            messagesContainer.innerHTML = "";

            messagesContainer.style.display = "none";

            emptyChat.style.display = "flex";


            selectedUsername.textContent =
                "Select a user";

            selectedStatus.textContent =
                "No conversation selected";


            messageInput.value = "";

            messageInput.disabled = true;

            sendButton.disabled = true;


            chatContainer.classList.remove(
                "chat-open"
            );
    }

                async function startApp() {

            if (!state.token) {
                showAuthScreen();
                return;
            }


            const userId =
                getCurrentUserId();


            if (!userId) {

                localStorage.removeItem(
                    "access_token"
                );

                state.token = null;

                showAuthScreen();

                return;
            }


            state.currentUserId = userId;


            showChatScreen();


            await loadUsers();


            connectSocket();
        }


        async function loadUsers() {

            usersContainer.innerHTML = `
                <div class="loading">
                    Loading users...
                </div>
            `;


            try {

                const response =
                    await fetch("/users", {
                        headers: {
                            "Authorization":
                                `Bearer ${state.token}`
                        }
                    });


                const data =
                    await response.json();


                if (!response.ok) {

                    if (
                        response.status === 401 ||
                        response.status === 403
                    ) {
                        logout();
                        return;
                    }


                    throw new Error(
                        getErrorMessage(data)
                    );
                }


                state.users = data;


                renderUsers();

            } catch (error) {

                console.error(
                    "Load users error:",
                    error
                );


                usersContainer.innerHTML = `
                    <div class="error-message">
                        ${escapeHtml(
                            error.message ||
                            "Unable to load users."
                        )}
                    </div>
                `;
            }
        }


        function renderUsers() {

            usersContainer.innerHTML = "";


            if (!state.users.length) {

                usersContainer.innerHTML = `
                    <div class="loading">
                        No other users found.
                    </div>
                `;

                return;
            }


            state.users.forEach(user => {

                const item =
                    document.createElement("div");


                item.className =
                    "user-item";


                if (
                    state.selectedUser &&
                    state.selectedUser.id === user.id
                ) {
                    item.classList.add("selected");
                }


                item.dataset.userId =
                    user.id;


                item.innerHTML = `
                    <div class="user-info">

                        <div class="username">
                            ${escapeHtml(user.username)}
                        </div>

                        <div
                            class="status"
                            id="status-${user.id}"
                        >
                            Checking status...
                        </div>

                    </div>
                `;


                item.addEventListener(
                    "click",
                    () => selectUser(user)
                );


                usersContainer.appendChild(item);


                updateUserStatus(user.id);
            });
        }


        async function updateUserStatus(userId) {

            try {

                const response =
                    await fetch(
                        `/users/${userId}/status`
                    );


                if (!response.ok) {
                    return;
                }


                const data =
                    await response.json();


                const statusElement =
                    document.getElementById(
                        `status-${userId}`
                    );


                if (!statusElement) {
                    return;
                }


                statusElement.textContent =
                    data.online
                        ? "Online"
                        : "Offline";


                statusElement.classList.toggle(
                    "online",
                    data.online
                );


                if (
                    state.selectedUser &&
                    state.selectedUser.id === userId
                ) {

                    selectedStatus.textContent =
                        data.online
                            ? "Online"
                            : "Offline";
                }

            } catch (error) {

                console.error(
                    "Status error:",
                    error
                );
            }
        }


        function escapeHtml(value) {

            const div =
                document.createElement("div");

            div.textContent =
                String(value ?? "");

            return div.innerHTML;
        }
                async function selectUser(user) {

            state.selectedUser = user;


            document
                .querySelectorAll(".user-item")
                .forEach(item => {

                    item.classList.toggle(
                        "selected",
                        Number(item.dataset.userId) ===
                        user.id
                    );
                });


            selectedUsername.textContent =
                user.username;


            selectedStatus.textContent =
                "Checking status...";


            emptyChat.style.display = "none";

            messagesContainer.style.display =
                "flex";

            messagesContainer.innerHTML = "";


            messageInput.disabled = false;

            messageInput.focus();


            chatContainer.classList.add(
                "chat-open"
            );


            await updateUserStatus(user.id);


            updateSendButton();
        }


        function connectSocket() {

            if (!state.token) {
                return;
            }


            if (
                state.socket &&
                (
                    state.socket.readyState ===
                    WebSocket.OPEN ||
                    state.socket.readyState ===
                    WebSocket.CONNECTING
                )
            ) {
                return;
            }


            const protocol =
                window.location.protocol === "https:"
                    ? "wss:"
                    : "ws:";


            const socketUrl =
                `${protocol}//${window.location.host}` +
                `/ws?token=${encodeURIComponent(
                    state.token
                )}`;


            try {

                state.socket =
                    new WebSocket(socketUrl);

            } catch (error) {

                console.error(
                    "WebSocket creation error:",
                    error
                );

                scheduleReconnect();

                return;
            }


            state.socket.onopen = () => {

                console.log(
                    "WebSocket connected"
                );


                state.reconnectAttempts = 0;


                updateSendButton();


                if (state.selectedUser) {

                    updateUserStatus(
                        state.selectedUser.id
                    );
                }
            };


            state.socket.onmessage =
                event => {

                    try {

                        const data =
                            JSON.parse(event.data);


                        handleSocketMessage(data);

                    } catch (error) {

                        console.error(
                            "WebSocket message error:",
                            error
                        );
                    }
                };


            state.socket.onerror =
                error => {

                    console.error(
                        "WebSocket error:",
                        error
                    );
                };


            state.socket.onclose = event => {

                console.log(
                    "WebSocket closed:",
                    event.code
                );


                state.socket = null;

                updateSendButton();


                if (state.token) {
                    scheduleReconnect();
                }
            };
        }


        function scheduleReconnect() {

            if (
                state.reconnectTimer ||
                !state.token
            ) {
                return;
            }


            state.reconnectAttempts += 1;


            const delay =
                Math.min(
                    1000 *
                    Math.pow(
                        2,
                        state.reconnectAttempts - 1
                    ),
                    10000
                );


            state.reconnectTimer =
                setTimeout(() => {

                    state.reconnectTimer = null;

                    connectSocket();

                }, delay);
        }


        function updateSendButton() {

            const hasText =
                messageInput.value.trim().length > 0;


            const socketReady =
                state.socket &&
                state.socket.readyState ===
                WebSocket.OPEN;


            sendButton.disabled =
                !hasText ||
                !state.selectedUser ||
                !socketReady;
        }
                function handleSocketMessage(data) {

            if (!data || !data.type) {
                return;
            }


            if (data.type === "message") {

                handleIncomingMessage(data);

                return;
            }


            if (data.type === "message_sent") {

                handleSentMessage(data);

                return;
            }


            if (data.type === "error") {

                console.error(
                    "Server error:",
                    data.message
                );

                return;
            }
        }


        function handleIncomingMessage(data) {

            const isCurrentConversation =
                state.selectedUser &&
                Number(data.sender_id) ===
                    Number(state.selectedUser.id);


            if (!isCurrentConversation) {
                return;
            }


            renderMessage({
                id: data.id,
                sender_id: data.sender_id,
                receiver_id: data.receiver_id,
                content: data.content,
                delivered: data.delivered,
                read: data.read || false
            });


            scrollMessagesToBottom();
        }


        function handleSentMessage(data) {

            renderMessage({
                id: data.id,
                sender_id: state.currentUserId,
                receiver_id: data.receiver_id,
                content: data.content,
                delivered: data.delivered,
                read: false
            });


            scrollMessagesToBottom();
        }


        function renderMessage(message) {

            if (!state.selectedUser) {
                return;
            }


            const belongsToConversation =
                (
                    Number(message.sender_id) ===
                    Number(state.currentUserId)
                &&
                    Number(message.receiver_id) ===
                    Number(state.selectedUser.id)
                )
                ||
                (
                    Number(message.sender_id) ===
                    Number(state.selectedUser.id)
                &&
                    Number(message.receiver_id) ===
                    Number(state.currentUserId)
                );


            if (!belongsToConversation) {
                return;
            }


            const element =
                document.createElement("div");


            const sent =
                Number(message.sender_id) ===
                Number(state.currentUserId);


            element.className =
                `message ${
                    sent
                        ? "sent"
                        : "received"
                }`;


            const time =
                new Date().toLocaleTimeString(
                    [],
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );


            const ticks =
                sent
                    ? (
                        message.delivered
                            ? "✓✓"
                            : "✓"
                    )
                    : "";


            element.innerHTML = `
                <span class="message-content">
                    ${escapeHtml(message.content)}
                </span>

                <span class="message-meta">

                    <span class="message-time">
                        ${time}
                    </span>

                    ${
                        sent
                            ? `
                                <span
                                    class="message-ticks ${
                                        message.delivered
                                            ? "delivered"
                                            : ""
                                    }"
                                >
                                    ${ticks}
                                </span>
                            `
                            : ""
                    }

                </span>
            `;


            element.dataset.messageId =
                message.id;


            messagesContainer.appendChild(
                element
            );
        }


        function scrollMessagesToBottom() {

            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;
        }


        function sendMessage() {

            if (
                !state.socket ||
                state.socket.readyState !==
                    WebSocket.OPEN
            ) {
                return;
            }


            if (!state.selectedUser) {
                return;
            }


            const content =
                messageInput.value.trim();


            if (!content) {
                return;
            }


            state.socket.send(
                JSON.stringify({
                    receiver_id:
                        state.selectedUser.id,

                    content: content
                })
            );


            messageInput.value = "";

            updateSendButton();

            messageInput.focus();
        }


        function logout() {

            if (state.reconnectTimer) {

                clearTimeout(
                    state.reconnectTimer
                );

                state.reconnectTimer = null;
            }


            if (state.socket) {

                state.socket.close();

                state.socket = null;
            }


            localStorage.removeItem(
                "access_token"
            );


            state.token = null;

            clearChatState();

            showAuthScreen();

            setAuthMode("login");

            usernameInput.value = "";

            passwordInput.value = "";

            emailInput.value = "";

            showAuthMessage("", false);
        }
                sendButton.addEventListener(
            "click",
            sendMessage
        );


        messageInput.addEventListener(
            "input",
            updateSendButton
        );


        messageInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();
                }
            }
        );


        logoutButton.addEventListener(
            "click",
            logout
        );


        window.addEventListener(
            "load",
            () => {

                setAuthMode("login");

                startApp();
            }
        );


        document.addEventListener(
            "visibilitychange",
            () => {

                if (
                    !document.hidden &&
                    state.token
                ) {

                    updateSendButton();


                    if (
                        !state.socket ||
                        state.socket.readyState !==
                            WebSocket.OPEN
                    ) {
                        connectSocket();
                    }


                    if (state.selectedUser) {

                        updateUserStatus(
                            state.selectedUser.id
                        );
                    }
                }
            }
        );


        window.addEventListener(
            "online",
            () => {

                if (state.token) {
                    connectSocket();
                }
            }
        );


        window.addEventListener(
            "offline",
            () => {

                updateSendButton();
            }
        );

    </script>

</body>

</html>
